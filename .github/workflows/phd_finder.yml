name: Discover Professors (Daily Batch of 5)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: professor-discovery
  cancel-in-progress: false

jobs:
  run-lead-finder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl scikit-learn

      - name: Run Lead Discovery Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python find_professors.py

      - name: Commit and push updated file back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage each tracking/output file individually if it exists
          for f in "List of emails.xlsx" "List of emails.xlsx - Sheet1.csv" "Faculty Results.csv"; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "Staged: $f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update processed universities and faculty leads [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Successfully pushed updated tracking files to ${GITHUB_REF_NAME}."
          fi
